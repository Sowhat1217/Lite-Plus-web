<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="/favicon.png?v=lite-icon-0e86dd" type="image/png" />
    <meta name="description" content="All your servers, one simple view." />
    <meta
      name="keywords"
      content="server monitor, Lite, server uptime monitoring, real-time server status, server performance dashboard, monitoring tool"
    />
    <meta name="author" content="Nomi" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      (() => {
        const parseAppearance = (value) => {
          if (!value) return "system";
          try {
            const parsed = JSON.parse(value);
            return typeof parsed === "string" ? parsed : value;
          } catch {
            return value;
          }
        };

        try {
          const appearance = parseAppearance(localStorage.getItem("appearance"));
          const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
          const isDark = appearance === "dark" || (appearance !== "light" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          const themeColor = isDark ? "#161C24" : "#FFFFFF";
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", themeColor);
        } catch {
          document.documentElement.classList.remove("dark");
        }
        const standalone =
          window.matchMedia?.("(display-mode: standalone)").matches ||
          window.matchMedia?.("(display-mode: fullscreen)").matches ||
          window.navigator.standalone === true;
        document.documentElement.classList.toggle("lite-standalone", Boolean(standalone));
      })();
    </script>
    <style>
      :where(html) {
      background: #F4F6F8;
        color-scheme: light;
      }

      :where(html.dark) {
        background: #161C24;
        color-scheme: dark;
      }

      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
      }
    </style>
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lite" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=lite-icon-0e86dd" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=lite-icon-0e86dd" />
    
    <meta property="og:title" content="Lite" />
    <meta property="og:description" content="All your servers, one simple view." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lite" />
    <meta name="twitter:description" content="All your servers, one simple view." />
    <title>Lite</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
